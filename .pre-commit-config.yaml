repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: local
    hooks:
      - id: block-openai-keys
        name: block OpenAI API keys
        language: pygrep
        entry: "sk-[A-Za-z0-9_-]{20,}"
      - id: block-env-files
        name: block .env files
        language: fail
        entry: ".env files must never be committed"
        files: '(^|/)\.env$'
